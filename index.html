function legs(pts){const out=[];for(let i=1;i<pts.length;i++){const A=pts[i-1],B=pts[i];let poly=[{x:A.x,y:A.y}];
 if(S.mode=="path"){const a=near(A),b=near(B);if(a!=b)sp(a,b).forEach(k=>poly.push({x:N[k][0],y:N[k][1]}));else poly.push({x:N[a][0],y:N[a][1]})}
 poly.push({x:B.x,y:B.y});out.push(poly)}return out}
function route(g,k,pts,col){
 const use=new Map(),cid=p=>Math.round(p.x/12)+","+Math.round(p.y/12);
 const L=legs(pts).map(poly=>poly.map((p,i)=>{if(!i)return p;return p}).reduce((acc,q,i,arr)=>{if(i){const p=arr[i-1],kp=cid(p),kq=cid(q);if(kp!=kq){const key=kp<kq?kp+"|"+kq:kq+"|"+kp;const n=use.get(key)||0;use.set(key,n+1);
  const o=n?((n%2)?1:-1)*Math.ceil(n/2)*7:0,[a,b]=kp<kq?[p,q]:[q,p],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
  acc.push([p.x+(-dy/l)*o,p.y+(dx/l)*o,q.x+(-dy/l)*o,q.y+(dx/l)*o])}}return acc},[]));
 g.lineCap="round";g.lineJoin="round";
 for(const [w,s] of [[11,"rgba(0,0,0,.65)"],[6,col]]){g.strokeStyle=s;g.lineWidth=w*k;L.forEach(sg=>sg.forEach(a=>{g.beginPath();g.moveTo(a[0]*k,a[1]*k);g.lineTo(a[2]*k,a[3]*k);g.stroke()}))}
 L.forEach(sg=>{if(!sg.length)return;const a=sg.reduce((m,s)=>Math.hypot(s[2]-s[0],s[3]-s[1])>Math.hypot(m[2]-m[0],m[3]-m[1])?s:m);
  const mx=(a[0]+a[2])/2*k,my=(a[1]+a[3])/2*k,an=Math.atan2(a[3]-a[1],a[2]-a[0]),s=13*k;
  g.fillStyle=col;g.strokeStyle="#000";g.lineWidth=2*k;g.beginPath();g.moveTo(mx+Math.cos(an)*s,my+Math.sin(an)*s);
  g.lineTo(mx+Math.cos(an+2.5)*s,my+Math.sin(an+2.5)*s);g.lineTo(mx+Math.cos(an-2.5)*s,my+Math.sin(an-2.5)*s);g.closePath();g.fill();g.stroke()});
 const G=[];pts.forEach((p,i)=>{const t=G.find(q=>Math.hypot(q.x-p.x,q.y-p.y)<26);t?t.ids.push(i+1):G.push({x:p.x,y:p.y,ids:[i+1]})});
 G.forEach(q=>{const t=q.ids.join("·");g.font="bold "+(19*k)+"px sans-serif";const w=Math.max(34*k,g.measureText(t).width+18*k),h=34*k,X=q.x*k-w/2,Y=q.y*k-h/2;
  g.fillStyle=col;g.strokeStyle="#fff";g.lineWidth=4*k;g.beginPath();g.roundRect?g.roundRect(X,Y,w,h,h/2):g.rect(X,Y,w,h);g.fill();g.stroke();
  g.fillStyle=dark(col)?"#111":"#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(t,q.x*k,q.y*k+k)})}
function draw(){x.clearRect(0,0,1080,885);if(img.complete)x.drawImage(img,0,0);route(x,1,D().pts,D().color)}
function render(){
 const pts=D().pts,col=D().color;ttl.value=D().title;md.textContent=S.mode=="path"?"길따라 이동 ✓":"직선 이동";
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d==S.day));
 sw.innerHTML=COL.map(k=>'<button class="sw'+(k==col?' on':'')+'" data-c="'+k+'" style="background:'+k+'"></button>').join("")+'<input type="color" id="cc" value="'+col+'">';
 cc.oninput=()=>{D().color=cc.value;save();draw()};cc.onchange=()=>render();
 const fg=dark(col)?"#111":"#fff";
 flow.innerHTML=pts.length?pts.map((p,i)=>(i?'<span style="color:var(--mu)">›</span>':'')+'<span class="chip" style="border-color:'+col+'"><b style="background:'+col+';color:'+fg+';border-radius:9px;padding:1px 6px;margin-right:4px">'+(i+1)+'</b>'+nm(p,i)+'</span>').join(""):'<span style="color:var(--mu);font-size:13px">경유지를 추가하면 순서가 표시돼요</span>';
 list.innerHTML="";
 pts.forEach((p,i)=>{const d=document.createElement("div");d.className="it";
  d.innerHTML='<div class="n" style="background:'+col+';color:'+fg+'">'+(i+1)+'</div><input class="t" placeholder="시간" value="'+(p.time||"")+'"><input class="l" placeholder="장소 이름" value="'+(p.name||"").replace(/"/g,"&quot;")+'"><button class="x">✕</button>';
  const [t,l,b]=d.querySelectorAll("input,button");
  t.oninput=()=>{p.time=t.value;save()};l.oninput=()=>{p.name=l.value;save();render2()};
  b.onclick=()=>{pts.splice(i,1);render()};list.appendChild(d)});
 draw();save();
}
function render2(){const a=document.activeElement,i=[...list.querySelectorAll(".l")].indexOf(a),s=a.selectionStart;render();if(i>=0){const n=list.querySelectorAll(".l")[i];n.focus();n.setSelectionRange(s,s)}}
tabs.onclick=e=>{const d=e.target.dataset.d;if(d){save();S.day=d;render()}};
sw.onclick=e=>{const k=e.target.dataset.c;if(k){D().color=k;render()}};
md.onclick=()=>{S.mode=S.mode=="path"?"line":"path";render()};
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1080/r.width,y:(e.clientY-r.top)*885/r.height}}
c.onpointerdown=e=>{const p=pos(e);moved=false;drag=D().pts.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<24);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(drag<0)return;const p=pos(e);D().pts[drag].x=p.x;D().pts[drag].y=p.y;moved=true;draw()};
c.onpointerup=e=>{if(drag<0){const p=pos(e);D().pts.push({x:p.x,y:p.y,name:"",time:""});render();return}
 drag=-1;if(moved)render()};
chips.innerHTML=ST.map((s,i)=>'<button class="chip" data-i="'+i+'">'+s[0]+'</button>').join("");
chips.onclick=e=>{const i=e.target.dataset.i;if(i==null)return;const s=ST[i],n=N[s[1]];D().pts.push({x:n[0],y:n[1],name:s[0],time:""});render()};
undo.onclick=()=>{D().pts.pop();render()};clr.onclick=()=>{D().pts=[];render()};
ttl.oninput=save;
function rr(g,X,Y,w,h,r){g.beginPath();g.moveTo(X+r,Y);g.arcTo(X+w,Y,X+w,Y+h,r);g.arcTo(X+w,Y+h,X,Y+h,r);g.arcTo(X,Y+h,X,Y,r);g.arcTo(X,Y,X+w,Y,r);g.closePath()}
go.onclick=()=>{
 const W=1080,H=1920,o=document.createElement("canvas");o.width=W;o.height=H;const g=o.getContext("2d"),pts=D().pts,col=D().color;
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#0c0720");bg.addColorStop(1,"#2a0f55");g.fillStyle=bg;g.fillRect(0,0,W,H);
 g.textAlign="center";g.textBaseline="alphabetic";g.fillStyle="#fff";g.font="bold 64px sans-serif";g.fillText("EDC KOREA 2026",W/2,170);
 g.fillStyle=col;g.font="bold 38px sans-serif";g.fillText(ttl.value,W/2,235);
 g.save();g.translate(0,300);g.drawImage(img,0,0);route(g,1,pts,col);g.restore();
 g.fillStyle="#a79fc4";g.font="bold 26px sans-serif";g.fillText("ROUTE",W/2,1235);
 let X=50,Y=1300;const lh=88,fg=dark(col)?"#111":"#fff";g.textBaseline="middle";g.font="bold 30px sans-serif";
 for(let i=0;i<pts.length;i++){const p=pts[i],t=(p.time?p.time+" ":"")+nm(p,i),tw=g.measureText(t).width,w=tw+90,ar=i?44:0;
  if(X+ar+w>W-50){X=50;Y+=lh}
  if(Y>H-60){g.textAlign="left";g.fillStyle="#a79fc4";g.fillText("… 외 "+(pts.length-i)+"곳",X,Y);break}
  if(i){if(X>50){g.fillStyle="#a79fc4";g.textAlign="center";g.fillText("›",X+ar/2,Y)}X+=X>50?ar:0}
  g.fillStyle="rgba(255,255,255,.12)";g.strokeStyle=col;g.lineWidth=3;rr(g,X,Y-30,w,60,30);g.fill();g.stroke();
  g.fillStyle=col;g.beginPath();g.arc(X+30,Y,20,0,7);g.fill();
  g.fillStyle=fg;g.textAlign="center";g.font="bold 24px sans-serif";g.fillText(i+1,X+30,Y+1);
  g.textAlign="left";g.fillStyle="#fff";g.font="bold 30px sans-serif";g.fillText(t,X+60,Y+1);X+=w}
 out.src=o.toDataURL("image/png");ov.style.display="flex"};
cl.onclick=()=>ov.style.display="none";
img.onload=draw;img.src=MAP;render();
</script></body></html>
