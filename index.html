 L.forEach((sg,i)=>{if(!sg.length)return;const a=sg.reduce((m,s)=>Math.hypot(s[2]-s[0],s[3]-s[1])>Math.hypot(m[2]-m[0],m[3]-m[1])?s:m);
  const mx=(a[0]+a[2])/2*k,my=(a[1]+a[3])/2*k,an=Math.atan2(a[3]-a[1],a[2]-a[0]),s=13*k;
  g.fillStyle=cs[i];g.strokeStyle="#000";g.lineWidth=2*k;g.beginPath();g.moveTo(mx+Math.cos(an)*s,my+Math.sin(an)*s);
  g.lineTo(mx+Math.cos(an+2.5)*s,my+Math.sin(an+2.5)*s);g.lineTo(mx+Math.cos(an-2.5)*s,my+Math.sin(an-2.5)*s);g.closePath();g.fill();g.stroke()});
 const G=[];pts.forEach((p,i)=>{const t=G.find(q=>Math.hypot(q.x-p.x,q.y-p.y)<14);t?t.ids.push(i+1):G.push({x:p.x,y:p.y,ids:[i+1]})});
 G.forEach(q=>{const col=cs[q.ids[0]-1],t=q.ids.join("·");g.font="bold "+(19*k)+"px sans-serif";const w=Math.max(34*k,g.measureText(t).width+18*k),h=34*k,X=q.x*k-w/2,Y=q.y*k-h/2;
  g.fillStyle=col;g.strokeStyle="#fff";g.lineWidth=4*k;g.beginPath();g.roundRect?g.roundRect(X,Y,w,h,h/2):g.rect(X,Y,w,h);g.fill();g.stroke();
  g.fillStyle=dark(col)?"#111":"#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(t,q.x*k,q.y*k+k)})}
function draw(){x.clearRect(0,0,1080,MH);if(img.complete)x.drawImage(img,0,0);route(x,1,D().pts,cols())}
function render(){
 const pts=D().pts,cs=cols(),au=auto();ttl.value=D().title;md.textContent=S.mode=="path"?"길따라 이동 ✓":"직선 이동";
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d==S.day));

 cc.oninput=()=>{D().color=cc.value;D().auto=false;pts.forEach(p=>delete p.c);save();draw()};cc.onchange=()=>render();
 flow.innerHTML=pts.length?pts.map((p,i)=>(i?'<span style="color:var(--mu)">›</span>':'')+'<span class="chip" style="border-color:'+cs[i]+'"><b style="background:'+cs[i]+';color:'+(dark(cs[i])?"#111":"#fff")+';border-radius:9px;padding:1px 6px;margin-right:4px">'+(i+1)+'</b>'+nm(p,i)+'</span>').join(""):'<span style="color:var(--mu);font-size:13px">경유지를 추가하면 순서가 표시돼요</span>';
 list.innerHTML="";
 pts.forEach((p,i)=>{const d=document.createElement("div");d.className="it";const fg=dark(cs[i])?"#111":"#fff";
  d.innerHTML='<span class="hd" title="끌어서 순서 변경">☰</span><div class="n" style="background:'+cs[i]+';color:'+fg+'">'+(i+1)+'</div><input class="t" placeholder="시간" value="'+(p.time||"")+'"><input class="l" placeholder="장소 이름" value="'+(p.name||"").replace(/"/g,"&quot;")+'"><button class="cb" style="background:'+cs[i]+';color:'+fg+'" title="이 경로 색">'+(i<pts.length-1?"→":"●")+'</button><button class="x del">✕</button>';
  const q=s=>d.querySelector(s);

  q(".del").onclick=()=>{pts.splice(i,1);openIdx=-1;render()};
  const hd=q(".hd");let dg=null;
  hd.onpointerdown=e=>{e.preventDefault();hd.setPointerCapture(e.pointerId);dg={y0:e.clientY,R:[...list.querySelectorAll(".it")].map(n=>n.getBoundingClientRect()),to:i};d.classList.add("dragging")};
  hd.onpointermove=e=>{if(!dg)return;d.style.transform="translateY("+(e.clientY-dg.y0)+"px)";const y=e.clientY,R=dg.R;let to=R.findIndex(r=>y>=r.top&&y<r.bottom);if(to<0)to=y<R[0].top?0:R.length-1;dg.to=to;list.querySelectorAll(".it").forEach((n,k)=>n.classList.toggle("dropat",k==to&&k!=i))};
  hd.onpointerup=hd.onpointercancel=()=>{if(!dg)return;const to=dg.to;dg=null;if(to!=i){const[m]=pts.splice(i,1);pts.splice(to,0,m);openIdx=-1}render()};
  list.appendChild(d);
  if(openIdx==i){const pl=document.createElement("div");pl.className="pal";
   pl.innerHTML=PAL.map(k=>'<button class="sw'+(p.c==k?' on':'')+'" data-c="'+k+'" style="background:'+k+'"></button>').join("")+'<input type="color" class="pc" value="'+cs[i]+'"><button class="chip" data-r="1">기본색</button>';
   pl.onclick=e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.r)delete p.c;else if(t.dataset.c)p.c=t.dataset.c;else return;render()};
   pl.querySelector(".pc").onchange=e=>{p.c=e.target.value;render()};list.appendChild(pl)}});
 draw();save();
}

c.onpointermove=e=>{if(drag<0)return;const p=pos(e);D().pts[drag].x=p.x;D().pts[drag].y=p.y;moved=true;draw()};
c.onpointerup=e=>{if(drag<0){const p=pos(e);D().pts.push({x:p.x,y:p.y,name:"",time:""});render();return}
 drag=-1;if(moved)render()};

chips.onclick=e=>{const i=e.target.dataset.i;if(i==null)return;const s=ST[i],n=N[s[1]];D().pts.push({x:n[0],y:n[1],name:s[0],time:""});render()};

fchips.onclick=e=>{const i=e.target.dataset.i;if(i==null)return;const s=FAC[i];let X=s[1],Y=s[2],n=0;
 while(D().pts.some(p=>Math.hypot(p.x-X,p.y-Y)<22)&&n<12){n++;X=s[1]+n*26;Y=s[2]+n*18}

function rr(g,X,Y,w,h,r){g.beginPath();g.moveTo(X+r,Y);g.arcTo(X+w,Y,X+w,Y+h,r);g.arcTo(X+w,Y+h,X,Y+h,r);g.arcTo(X,Y+h,X,Y,r);g.arcTo(X,Y,X+w,Y,r);g.closePath()}
const OP={day:"d3",view:"map",bg:"star",ratio:"story",fmt:"png",title:true,route:true,time:true};let lastCv=null;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawBg(g,W,H,st){
 if(st=="black"){g.fillStyle="#05030d";g.fillRect(0,0,W,H);return}
 const bg=g.createLinearGradient(0,0,0,H);
 if(st=="star"){bg.addColorStop(0,"#0a0524");bg.addColorStop(.55,"#1a0a40");bg.addColorStop(1,"#37136b")}else{bg.addColorStop(0,"#0c0720");bg.addColorStop(1,"#2a0f55")}
 g.fillStyle=bg;g.fillRect(0,0,W,H);
 if(st=="star"){
  [[.1,.08,"255,60,172",.22],[.95,.55,"0,212,255",.16],[.2,.95,"138,123,255",.2]].forEach(([fx,fy,c,al])=>{const r=Math.max(W,H)*.55,gr=g.createRadialGradient(fx*W,fy*H,0,fx*W,fy*H,r);gr.addColorStop(0,"rgba("+c+","+al+")");gr.addColorStop(1,"rgba("+c+",0)");g.fillStyle=gr;g.fillRect(0,0,W,H)});
  const r=rng(7),n=Math.round(W*H/5200);for(let i=0;i<n;i++){const x=r()*W,y=r()*H,sz=r()<.1?2.2:r()<.4?1.4:.9;g.fillStyle="rgba(255,255,255,"+(.25+r()*.6)+")";g.beginPath();g.arc(x,y,sz,0,7);g.fill()}}
 if(st=="blur"&&img.complete){const tw=54,th=Math.round(54*H/W),t=document.createElement("canvas");t.width=tw;t.height=th;const k=Math.max(tw/1080,th/MH);t.getContext("2d").drawImage(img,(tw-1080*k)/2,(th-MH*k)/2,1080*k,MH*k);g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";g.drawImage(t,0,0,W,H);g.fillStyle="rgba(12,7,32,.74)";g.fillRect(0,0,W,H)}}
function build(){
 const W=1080,pad=40,ch=52,gp=22,ar=28,SG=110,vh=OP.view=="map"?640:MH,days=OP.day=="both"?["d3","d4"]:[OP.day],multi=days.length>1,mw=W-2*pad-70;
 const m=document.createElement("canvas").getContext("2d");m.font="bold 26px sans-serif";
 const secs=days.map(dk=>{const pts=S[dk].pts,cs=colsOf(dk),R=OP.route&&pts.length>0;
  const it=pts.map((p,i)=>{let t=(OP.time&&p.time?p.time+" ":"")+nm(p,i);if(m.measureText(t).width>mw){while(m.measureText(t+"…").width>mw&&t.length>1)t=t.slice(0,-1);t+="…"}return{t,w:Math.ceil(m.measureText(t).width)+70}});
  let cx=pad,row=0;it.forEach(o=>{if(cx>pad&&cx+ar+o.w>W-pad){row++;cx=pad}if(cx>pad)cx+=ar;o.x=cx;o.r=row;cx+=o.w});
  const rows=R?row+1:0,rh=R?58+rows*ch+(rows-1)*gp:0,th=OP.title?(multi?64:50):0;
  return{dk,pts,cs,R,it,rh,th,h:th+vh+(R?36+rh:0)}});
 const Ct=100+secs.reduce((a,s)=>a+s.h,0)+(secs.length-1)*SG,story=OP.ratio=="story",sc=story?Math.min(1,1760/Ct):1,H=story?1920:Ct+80;
 const o=document.createElement("canvas");o.width=W;o.height=H;const g=o.getContext("2d");
 drawBg(g,W,H,OP.bg);
 g.save();g.translate((W-W*sc)/2,(H-Ct*sc)/2);g.scale(sc,sc);
 g.textAlign="center";g.textBaseline="alphabetic";g.fillStyle="#fff";g.font="bold 56px sans-serif";g.fillText("EDC KOREA 2026",W/2,62);
 let y=100;
 secs.forEach((s,si)=>{if(si){y+=SG;g.strokeStyle="rgba(255,255,255,.2)";g.lineWidth=2;g.beginPath();g.moveTo(pad*2,y-SG/2);g.lineTo(W-pad*2,y-SG/2);g.stroke()}
  if(OP.title){g.textAlign="center";g.textBaseline="alphabetic";g.fillStyle=s.cs[0]||S[s.dk].color;g.font="bold 32px sans-serif";g.fillText(S[s.dk].title,W/2,y+(multi?40:12))}
  const my=y+s.th;g.save();g.translate(0,my);g.beginPath();g.rect(0,0,W,vh);g.clip();g.drawImage(img,0,0,1080,vh,0,0,1080,vh);route(g,1,s.pts,s.cs);g.restore();
  if(s.R){const y0=my+vh+36;g.fillStyle="#ff3cac";rr(g,pad,y0+2,6,32,3);g.fill();
   g.textAlign="left";g.textBaseline="alphabetic";g.fillStyle="#fff";g.font="bold 32px sans-serif";try{g.letterSpacing="3px"}catch(e){}g.fillText("ROUTE",pad+20,y0+30);try{g.letterSpacing="0px"}catch(e){}
   g.textBaseline="middle";
   s.it.forEach((q,i)=>{const yy=y0+58+q.r*(ch+gp)+ch/2;
    if(q.x>pad){g.fillStyle="#d8d0f5";g.textAlign="center";g.font="bold 30px sans-serif";g.fillText("›",q.x-ar/2,yy)}
    g.fillStyle="rgba(255,255,255,.12)";g.strokeStyle=s.cs[i];g.lineWidth=3;rr(g,q.x,yy-ch/2,q.w,ch,ch/2);g.fill();g.stroke();
    g.fillStyle=s.cs[i];g.beginPath();g.arc(q.x+26,yy,18,0,7);g.fill();
    g.fillStyle=dark(s.cs[i])?"#111":"#fff";g.textAlign="center";g.font="bold 21px sans-serif";g.fillText(i+1,q.x+26,yy+1);
    g.textAlign="left";g.fillStyle="#fff";g.font="bold 26px sans-serif";g.fillText(q.t,q.x+52,yy+1)})}
  y=my+vh+(s.R?36+s.rh:0)});
 g.restore();return o}
